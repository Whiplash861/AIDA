name: Validate Expo orb port

on:
  push:
    branches:
      - feature/mobile-backend-glass-integration
    paths:
      - .github/workflows/validate-mobile-orb.yml

permissions:
  contents: write

jobs:
  validate-mobile-orb:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-backend-glass-integration

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Clean install
        id: install
        continue-on-error: true
        working-directory: mobile
        run: npm ci

      - name: Strict TypeScript check
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: mobile
        run: npm run typecheck

      - name: Expo lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: mobile
        run: npm run lint

      - name: Bundle Android, iOS, and Web
        id: export
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: mobile
        run: npx expo export --platform all --output-dir .validation-dist

      - name: Record validation outcomes
        if: always()
        shell: bash
        run: |
          mkdir -p .github
          cat > .github/mobile-orb-validation.txt <<EOF
          install=${{ steps.install.outcome }}
          typecheck=${{ steps.typecheck.outcome }}
          lint=${{ steps.lint.outcome }}
          export_all=${{ steps.export.outcome }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/mobile-orb-validation.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Expo orb validation outcomes"
          git push origin HEAD:feature/mobile-backend-glass-integration
