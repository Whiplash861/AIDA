name: Validate Expo orb port

on:
  push:
    branches:
      - feature/mobile-backend-glass-integration
    paths:
      - .github/workflows/validate-mobile-orb.yml

permissions:
  contents: write

jobs:
  validate-mobile-orb:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-backend-glass-integration

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Clean install
        working-directory: mobile
        run: npm ci

      - name: Strict TypeScript check
        working-directory: mobile
        run: npm run typecheck

      - name: Expo lint
        working-directory: mobile
        run: npm run lint

      - name: Bundle Android, iOS, and Web
        working-directory: mobile
        run: npx expo export --platform all --output-dir .validation-dist

      - name: Record validation success
        shell: bash
        run: |
          printf 'Expo orb validation passed: npm ci, typecheck, lint, Android/iOS/Web export.\n' > .github/mobile-orb-validation.ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/mobile-orb-validation.ok
          git commit -m "Record Expo orb validation success"
          git push origin HEAD:feature/mobile-backend-glass-integration
