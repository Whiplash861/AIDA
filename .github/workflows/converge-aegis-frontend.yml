name: Converge Aegis frontend with known-good Interface

on:
  push:
    branches:
      - agent/aegis-engine-early-alpha
    paths:
      - .github/workflows/converge-aegis-frontend.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aegis-engine-early-alpha
          fetch-depth: 0

      - name: Fetch known-good Interface snapshot
        shell: bash
        run: git fetch origin snapshot/frontend-known-good-2026-08-21

      - name: Restore known-good Interface and supporting Technomancer runtime
        shell: bash
        run: |
          git checkout origin/snapshot/frontend-known-good-2026-08-21 -- \
            aida/engines \
            aida/technomancer \
            aida/frontend/_window_base.py \
            aida/frontend/app.py \
            aida/frontend/command_router.py \
            aida/frontend/commands/base.py \
            aida/frontend/commands/registry.py \
            aida/frontend/commands/technomancer.py \
            aida/frontend/controller.py \
            aida/frontend/engine_state.py \
            aida/frontend/internal_orb.py \
            aida/frontend/live_overlay.py \
            aida/frontend/overlay.py \
            aida/frontend/status_orb.py \
            aida/frontend/theme.py \
            aida/frontend/widgets.py \
            aida/frontend/window.py \
            test_technomancer_engine.py \
            tests/frontend/test_technomancer_frontend.py

      - name: Reapply minimal Aegis command integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path("aida/frontend/command_router.py")
          text = router.read_text(encoding="utf-8")
          anchor = "    SECURITY_STATUS = auto()\n"
          addition = anchor + "    SECURITY_INTELLIGENT_SCAN = auto()\n"
          if "SECURITY_INTELLIGENT_SCAN" not in text:
              if anchor not in text:
                  raise SystemExit("router security-status anchor missing")
              text = text.replace(anchor, addition, 1)
          router.write_text(text, encoding="utf-8")

          registry = Path("aida/frontend/commands/registry.py")
          text = registry.read_text(encoding="utf-8")

          aegis_imports = (
              "from aida.aegis.engine import AegisEngine\n"
              "from aida.aegis.runtime import ensure_aegis_engine\n"
          )
          import_anchor = "from aida.applications.monitor import ApplicationHealthMonitor\n"
          if "from aida.aegis.engine import AegisEngine" not in text:
              if import_anchor not in text:
                  raise SystemExit("registry application import anchor missing")
              text = text.replace(import_anchor, aegis_imports + import_anchor, 1)

          executor_import = "from aida.frontend.commands.aegis import AegisIntelligentScanExecutor\n"
          executor_anchor = "from aida.frontend.commands.application import (\n"
          if executor_import not in text:
              if executor_anchor not in text:
                  raise SystemExit("registry executor import anchor missing")
              text = text.replace(executor_anchor, executor_import + executor_anchor, 1)

          parameter_anchor = "        detection_reader: DetectionReader | None = None,\n"
          parameter_addition = parameter_anchor + "        aegis_engine: AegisEngine | None = None,\n"
          if "aegis_engine: AegisEngine | None = None" not in text:
              if parameter_anchor not in text:
                  raise SystemExit("registry constructor parameter anchor missing")
              text = text.replace(parameter_anchor, parameter_addition, 1)

          aegis_init = '''        self.aegis = aegis_engine or ensure_aegis_engine(\n            config,\n            memory=self.memory,\n            threat_analysis=self.threat_analysis,\n            detection_reader=self._detection_reader,\n        )\n'''
          init_anchor = "        self.application_monitor = application_monitor or ApplicationHealthMonitor()\n"
          if "self.aegis = aegis_engine or ensure_aegis_engine" not in text:
              if init_anchor not in text:
                  raise SystemExit("registry application monitor anchor missing")
              text = text.replace(init_anchor, aegis_init + init_anchor, 1)

          factory_anchor = "            CommandType.SECURITY_STATUS: lambda command: SecurityStatusExecutor(),\n"
          aegis_factory = factory_anchor + '''            CommandType.SECURITY_INTELLIGENT_SCAN: lambda command: AegisIntelligentScanExecutor(\n                self.aegis,\n                lambda: self._security_scan(SecurityScanMode.SURFACE, command),\n            ),\n'''
          if "CommandType.SECURITY_INTELLIGENT_SCAN:" not in text:
              if factory_anchor not in text:
                  raise SystemExit("registry security factory anchor missing")
              text = text.replace(factory_anchor, aegis_factory, 1)

          registry.write_text(text, encoding="utf-8")
          PY

      - name: Validate convergence boundaries
        shell: bash
        run: |
          python -m compileall -q aida tests test_technomancer_engine.py
          grep -n 'SECURITY_INTELLIGENT_SCAN' aida/frontend/command_router.py
          grep -n 'AegisIntelligentScanExecutor' aida/frontend/commands/registry.py
          grep -n 'register_technomancer_intents' aida/frontend/command_router.py
          grep -n 'TechnomancerCommandExecutor' aida/frontend/commands/registry.py
          grep -n 'header_layout.insertStretch(insert_at, 1)' aida/frontend/window.py
          test -f aida/frontend/commands/aegis.py
          test -d aida/aegis
          git diff --exit-code HEAD -- aida/artificer

      - name: Commit convergence
        shell: bash
        run: |
          git config user.name "AIDA GitHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aida/engines \
            aida/technomancer \
            aida/frontend \
            test_technomancer_engine.py \
            tests/frontend/test_technomancer_frontend.py
          git commit -m "Converge Aegis with known-good Interface snapshot"
          git push origin HEAD:agent/aegis-engine-early-alpha
