name: AIDA Windows validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      AIDA_AEGIS_ENABLED: "false"
      AIDA_ARTIFICER_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile AIDA and tests
        shell: pwsh
        run: python -m compileall -q aida tests

      - name: Run Aegis focused tests
        shell: pwsh
        run: python -m pytest -q tests/aegis

      - name: Run complete regression suite
        shell: pwsh
        run: python -m pytest -q
