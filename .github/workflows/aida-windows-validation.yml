name: AIDA Windows validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      AIDA_AEGIS_ENABLED: "false"
      AIDA_AEGIS_REMOTE_MONITOR_ENABLED: "false"
      AIDA_ARTIFICER_ENABLED: "false"
      AIDA_CLOUD_MEMORY_ENABLED: "false"
      AIDA_DATA_DIR: ${{ runner.temp }}/aida-tests
      AIDA_OPERATIONAL_STATE_PATH: ${{ runner.temp }}/aida-tests/operational-state.json
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c requirements-lock.txt
          python -m pip check

      - name: Compile AIDA and tests
        shell: pwsh
        run: python -m compileall -q aida tests

      - name: Run complete regression suite
        shell: pwsh
        run: python -m pytest -q --tb=short
