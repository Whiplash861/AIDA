name: Apply Technomancer cyan orb state

on:
  push:
    branches:
      - feature/technomancer-engine
    paths:
      - .github/workflows/apply-technomancer-cyan.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/technomancer-engine

      - name: Patch refined orb architecture for Technomancer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # Native CYAN visual state in the shared orb engine.
          p = Path("aida/frontend/internal_orb.py")
          s = p.read_text(encoding="utf-8")
          s = replace_once(
              s,
              "from aida.frontend.status import AIDAStatus\n",
              "from aida.frontend.status import AIDAStatus\nfrom aida.technomancer.models import TECHNOMANCER_COLOR\n",
              "technomancer import",
          )
          s = replace_once(
              s,
              '    PURPLE = "purple"\n    RED = "red"\n',
              '    PURPLE = "purple"\n    CYAN = "cyan"\n    RED = "red"\n',
              "cyan enum",
          )
          s = replace_once(
              s,
              '    ARTIFICER_FAILURE = "ARTIFICER-FAILURE"\n',
              '    ARTIFICER_FAILURE = "ARTIFICER-FAILURE"\n    TECHNOMANCER_FAILURE = "TECHNOMANCER-FAILURE"\n',
              "technomancer trouble code",
          )
          s = replace_once(
              s,
              "    OrbTroubleCode.ARTIFICER_FAILURE.value: OrbVisualState.RED,\n}",
              "    OrbTroubleCode.ARTIFICER_FAILURE.value: OrbVisualState.RED,\n    OrbTroubleCode.TECHNOMANCER_FAILURE.value: OrbVisualState.RED,\n}",
              "technomancer trouble mapping",
          )
          s = replace_once(
              s,
              "    OrbVisualState.RED: (\n",
              "    OrbVisualState.CYAN: (\n        QColor(TECHNOMANCER_COLOR),\n        QColor(\"#7CF5FF\"),\n        QColor(\"#F4FEFF\"),\n        QColor(\"#04333A\"),\n        QColor(\"#011114\"),\n    ),\n    OrbVisualState.RED: (\n",
              "cyan palette",
          )
          s = replace_once(
              s,
              "_ACTIVE_ARTIFICER_STATES = {\n    ArtificerStatus.OBSERVING.value,\n    ArtificerStatus.REVIEWING.value,\n    ArtificerStatus.MAINTENANCE.value,\n    ArtificerStatus.ROLLBACK.value,\n}\n",
              "_ACTIVE_ARTIFICER_STATES = {\n    ArtificerStatus.OBSERVING.value,\n    ArtificerStatus.REVIEWING.value,\n    ArtificerStatus.MAINTENANCE.value,\n    ArtificerStatus.ROLLBACK.value,\n}\n\n_ACTIVE_TECHNOMANCER_STATES = {\n    \"running\",\n    \"working\",\n    \"analyzing\",\n    \"reviewing\",\n    \"monitoring\",\n}\n",
              "active technomancer states",
          )
          s = replace_once(
              s,
              "        self._artificer_status = ArtificerStatus.READY.value\n        self._active_artificer_tasks: set[str] = set()\n        self._trouble_codes: dict[str, OrbVisualState] = {}\n",
              "        self._artificer_status = ArtificerStatus.READY.value\n        self._active_artificer_tasks: set[str] = set()\n        self._technomancer_status = \"idle\"\n        self._active_technomancer_tasks: set[str] = set()\n        self._trouble_codes: dict[str, OrbVisualState] = {}\n",
              "technomancer fields",
          )
          s = replace_once(
              s,
              "            OrbVisualState.PURPLE,\n            OrbVisualState.RED,\n",
              "            OrbVisualState.PURPLE,\n            OrbVisualState.CYAN,\n            OrbVisualState.RED,\n",
              "cyan test sequence",
          )
          old_tasks = '''    def report_task_started(self, task_name: str) -> None:
        normalized = task_name.strip().lower()
        if normalized.startswith("artificer"):
            self._active_artificer_tasks.add(normalized)
            self._refresh_live_visual_state()

    def report_task_finished(self, task_name: str) -> None:
        normalized = task_name.strip().lower()
        if normalized in self._active_artificer_tasks:
            self._active_artificer_tasks.discard(normalized)
            self._refresh_live_visual_state()

    def report_task_failed(self, task_name: str) -> None:
        self.report_task_finished(task_name)
'''
          new_tasks = '''    def set_technomancer_status(self, text: str) -> None:
        normalized = text.strip().lower() or "idle"
        self._technomancer_status = normalized
        self.set_trouble_code(
            OrbTroubleCode.TECHNOMANCER_FAILURE,
            active=normalized in {"error", "failed", "failure"},
        )
        self._refresh_live_visual_state()

    def report_task_started(self, task_name: str) -> None:
        normalized = task_name.strip().lower()
        if normalized.startswith("artificer"):
            self._active_artificer_tasks.add(normalized)
            self._refresh_live_visual_state()
            return
        if normalized.startswith("technomancer"):
            self._active_technomancer_tasks.add(normalized)
            self._technomancer_status = "running"
            self.clear_trouble_code(OrbTroubleCode.TECHNOMANCER_FAILURE)
            self._refresh_live_visual_state()

    def report_task_finished(self, task_name: str) -> None:
        normalized = task_name.strip().lower()
        if normalized in self._active_artificer_tasks:
            self._active_artificer_tasks.discard(normalized)
            self._refresh_live_visual_state()
            return
        if normalized.startswith("technomancer"):
            self._active_technomancer_tasks.discard(normalized)
            if not self._active_technomancer_tasks:
                self._technomancer_status = "idle"
            self._refresh_live_visual_state()

    def report_task_failed(self, task_name: str) -> None:
        normalized = task_name.strip().lower()
        if normalized.startswith("technomancer"):
            self._active_technomancer_tasks.discard(normalized)
            self._technomancer_status = "error"
            self.set_trouble_code(
                OrbTroubleCode.TECHNOMANCER_FAILURE,
                active=True,
            )
            return
        self.report_task_finished(task_name)
'''
          s = replace_once(s, old_tasks, new_tasks, "technomancer task tracking")
          old_priority = '''        if (
            self._active_artificer_tasks
            or self._artificer_status in _ACTIVE_ARTIFICER_STATES
        ):
            return OrbVisualState.PURPLE

        if self._active_task_count > 0:
'''
          new_priority = '''        if (
            self._active_technomancer_tasks
            or self._technomancer_status in _ACTIVE_TECHNOMANCER_STATES
        ):
            return OrbVisualState.CYAN

        if (
            self._active_artificer_tasks
            or self._artificer_status in _ACTIVE_ARTIFICER_STATES
        ):
            return OrbVisualState.PURPLE

        if self._active_task_count > 0:
'''
          s = replace_once(s, old_priority, new_priority, "Technomancer priority")
          p.write_text(s, encoding="utf-8")

          # Semantic accessible label in the refined status orb.
          p = Path("aida/frontend/status_orb.py")
          s = p.read_text(encoding="utf-8")
          s = replace_once(
              s,
              "    _ACTIVE_ARTIFICER_STATES,\n    _PALETTES,\n",
              "    _ACTIVE_ARTIFICER_STATES,\n    _ACTIVE_TECHNOMANCER_STATES,\n    _PALETTES,\n",
              "status orb technomancer import",
          )
          s = replace_once(
              s,
              '''        if self._live_status.name == "SHUTDOWN":
            return "OFFLINE"
        if (
            self._active_artificer_tasks
''',
              '''        if self._live_status.name == "SHUTDOWN":
            return "OFFLINE"
        if (
            self._active_technomancer_tasks
            or self._technomancer_status in _ACTIVE_TECHNOMANCER_STATES
        ):
            return "TECHNOMANCER"
        if (
            self._active_artificer_tasks
''',
              "semantic technomancer status",
          )
          s = s.replace(
              '"""Run BLUE -> GREEN -> VIOLET -> RED -> current live state."""',
              '"""Run BLUE -> GREEN -> VIOLET -> CYAN -> RED -> current live state."""',
          )
          p.write_text(s, encoding="utf-8")

          # Header wiring, targeted CYAN test, and dashboard state.
          p = Path("aida/frontend/window.py")
          s = p.read_text(encoding="utf-8")
          s = replace_once(
              s,
              '            ("Ctrl+Shift+4", OrbVisualState.RED),\n',
              '            ("Ctrl+Shift+4", OrbVisualState.RED),\n            ("Ctrl+Shift+5", OrbVisualState.CYAN),\n',
              "cyan shortcut",
          )
          s = replace_once(
              s,
              '''    def set_active_task_count(self, count: int) -> None:
        super().set_active_task_count(count)
        self.internal_orb.set_active_task_count(count)
        self._refresh_orb_status_indicator()
''',
              '''    def set_technomancer_status(self, text: str) -> None:
        self.dashboard.set_technomancer_status(text)
        self.internal_orb.set_technomancer_status(text)
        self._refresh_orb_status_indicator()

    def set_active_task_count(self, count: int) -> None:
        super().set_active_task_count(count)
        self.internal_orb.set_active_task_count(count)
        self._refresh_orb_status_indicator()
''',
              "window technomancer setter",
          )
          s = replace_once(
              s,
              '''    def report_task_started(self, task_name: str) -> None:
        super().report_task_started(task_name)
        self.internal_orb.report_task_started(task_name)
        self._refresh_orb_status_indicator()

    def report_task_finished(self, task_name: str) -> None:
        super().report_task_finished(task_name)
        self.internal_orb.report_task_finished(task_name)
        self._refresh_orb_status_indicator()

    def report_task_failed(self, task_name: str, error_message: str) -> None:
        super().report_task_failed(task_name, error_message)
        self.internal_orb.report_task_failed(task_name)
        self._refresh_orb_status_indicator()
''',
              '''    def report_task_started(self, task_name: str) -> None:
        super().report_task_started(task_name)
        if task_name.strip().lower().startswith("technomancer"):
            self.dashboard.set_technomancer_status("RUNNING")
        self.internal_orb.report_task_started(task_name)
        self._refresh_orb_status_indicator()

    def report_task_finished(self, task_name: str) -> None:
        super().report_task_finished(task_name)
        if task_name.strip().lower().startswith("technomancer"):
            self.dashboard.set_technomancer_status("IDLE")
        self.internal_orb.report_task_finished(task_name)
        self._refresh_orb_status_indicator()

    def report_task_failed(self, task_name: str, error_message: str) -> None:
        super().report_task_failed(task_name, error_message)
        if task_name.strip().lower().startswith("technomancer"):
            self.dashboard.set_technomancer_status("ERROR")
        self.internal_orb.report_task_failed(task_name)
        self._refresh_orb_status_indicator()
''',
              "window technomancer task display",
          )
          s = s.replace(
              '"""Run BLUE -> GREEN -> VIOLET -> RED -> current live state."""',
              '"""Run BLUE -> GREEN -> VIOLET -> CYAN -> RED -> current live state."""',
          )
          s = s.replace(
              '"ORB color test: BLUE > GREEN > VIOLET > RED > LIVE"',
              '"ORB color test: BLUE > GREEN > VIOLET > CYAN > RED > LIVE"',
          )
          p.write_text(s, encoding="utf-8")

          # Preserve the Technomancer dashboard row but remove its old injected orb.
          p = Path("aida/frontend/widgets.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("from aida.frontend.header_orb import HeaderEngineOrb\n", "")
          s = s.replace("        self._header_orb: HeaderEngineOrb | None = None\n", "")
          start = s.find("    def showEvent(self, event) -> None:\n")
          end = s.find("    def _sync_engine_visual_state(self) -> None:\n")
          if start < 0 or end <= start:
              raise RuntimeError("legacy HeaderEngineOrb lifecycle block not found")
          s = s[:start] + s[end:]
          s = replace_once(
              s,
              '''    def _sync_engine_visual_state(self) -> None:
        technomancer_status = ENGINE_VISUAL_STATE.status("technomancer")
        if technomancer_status != self._last_technomancer_status:
            self._last_technomancer_status = technomancer_status
            self.technomancer_value.set_status_text(technomancer_status)
        if self._header_orb is not None:
            self._header_orb.update()

    def set_agent_status(self, status: AIDAStatus) -> None:
        self.agent_value.set_status_text(status.name)
        if self._header_orb is not None:
            self._header_orb.set_status(status)
''',
              '''    def _sync_engine_visual_state(self) -> None:
        technomancer_status = ENGINE_VISUAL_STATE.status("technomancer")
        if technomancer_status != self._last_technomancer_status:
            self._last_technomancer_status = technomancer_status
            self.technomancer_value.set_status_text(technomancer_status)

    def set_agent_status(self, status: AIDAStatus) -> None:
        self.agent_value.set_status_text(status.name)
''',
              "remove legacy header orb sync",
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Compile restored frontend
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            aida/frontend/overlay.py \
            aida/frontend/internal_orb.py \
            aida/frontend/status_orb.py \
            aida/frontend/live_overlay.py \
            aida/frontend/_window_base.py \
            aida/frontend/window.py \
            aida/frontend/widgets.py \
            aida/frontend/app.py

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Whiplash"
          git config user.email "145601386+Whiplash861@users.noreply.github.com"
          git add aida/frontend/internal_orb.py aida/frontend/status_orb.py aida/frontend/window.py aida/frontend/widgets.py
          git commit -m "Integrate Technomancer into refined orb states"
          git push origin HEAD:feature/technomancer-engine
