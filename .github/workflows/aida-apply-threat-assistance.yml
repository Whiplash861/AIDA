name: Apply AIDA Early Alpha Threat Assistance

on:
  push:
    branches:
      - agent/early-alpha-threat-assistance
    paths:
      - '.aida_transport/**'
      - '.github/workflows/aida-apply-threat-assistance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged branch
        uses: actions/checkout@v4
        with:
          ref: agent/early-alpha-threat-assistance
          fetch-depth: 0

      - name: Reassemble and verify implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat .aida_transport/chunk_* > /tmp/aida-threat-assistance.tar.gz.b64
          base64 --decode /tmp/aida-threat-assistance.tar.gz.b64 > /tmp/aida-threat-assistance.tar.gz
          echo 'ab0f32a1a9c3c1066970ceb4a09fa1bc27c0dd93e6363d739052dfbdd8eb2164  /tmp/aida-threat-assistance.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/aida-threat-assistance.tar.gz -C .

      - name: Compile AIDA source
        shell: bash
        run: python -m compileall -q aida

      - name: Remove one-use transport
        shell: bash
        run: |
          rm -rf .aida_transport
          rm -f .github/workflows/aida-apply-threat-assistance.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AIDA Build Agent'
          git config user.email '145601386+Whiplash861@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 1
          fi
          git commit -m 'Add Early Alpha threat analysis and guided assistance'
          git push origin HEAD:agent/early-alpha-threat-assistance
